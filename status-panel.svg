<g clip-path="url(#winClip)">
<circle cx="98" cy="135" r="90" fill="#f85149" opacity="0.05" filter="url(#ambientBlur)"><animate attributeName="cy" values="28;242;28" dur="14s" repeatCount="indefinite"/></circle>
