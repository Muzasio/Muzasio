name: generate animation
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339ff14&color_dots=%23161b22,%231f8f0c,%2326a30d,%2333c410,%2339ff14
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339ff14&color_dots=%23161b22,%231f8f0c,%2326a30d,%2333c410,%2339ff14
      - name: generate repo-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_repo_snake.py dist/repo-snake.svg
      - name: push svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: bump cache-busting query param in README.md
        run: |
          sed -i -E "s#(repo-snake\.svg)(\?ts=[0-9]+)?\"#\1?ts=${{ github.run_id }}\"#" README.md
          sed -i -E "s#(github-contribution-grid-snake(-dark)?\.svg)(\?ts=[0-9]+)?\"#\1?ts=${{ github.run_id }}\"#g" README.md
          if git diff --quiet README.md; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: bust image cache [skip ci]"
            git push
          fi
